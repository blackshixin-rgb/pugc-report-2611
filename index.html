<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>PUGC 投放素材盘点</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* 布局：数据驾驶舱，密度 8；顶部结论条 → 图表两栏 → 素材墙 → 大盘 → 内部投放。圆角 0/2，单强调色 */
/* 旋钮：变化度 5 · 动效 1 · 密度 8 */
:root{
  --bg:#f3f4f1; --paper:#fbfbf9; --fg:#16212b; --mute:#5b6670; --line:#d9ddd6; --soft:#e8ebe5;
  --accent:#0b7a6e; --accent-soft:#d3ebe6; --warn:#b4521e; --warn-soft:#f5e1d6;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"IBM Plex Sans Condensed","Noto Sans SC",system-ui,sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --t1:12px;--t2:14px;--t3:17px;--t4:21px;--t5:32px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181d;--paper:#182027;--fg:#e4e8e3;--mute:#9aa5ad;--line:#2c3740;--soft:#212b33;
  --accent:#4fbfae;--accent-soft:#1d3a37;--warn:#e08a5c;--warn-soft:#3a2a21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181d;--paper:#182027;--fg:#e4e8e3;--mute:#9aa5ad;--line:#2c3740;--soft:#212b33;
  --accent:#4fbfae;--accent-soft:#1d3a37;--warn:#e08a5c;--warn-soft:#3a2a21;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 var(--t2)/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s5) var(--s7)}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s6)}
h1{font:700 var(--t5)/1.15 var(--f-body);margin:0;text-wrap:balance}
h2{font:700 var(--t4)/1.25 var(--f-body);margin:0;text-wrap:balance}
h3{font:700 var(--t3)/1.3 var(--f-body);margin:0}
.mute{color:var(--mute)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;gap:var(--s4);flex-wrap:wrap;padding-block:var(--s2)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav a{text-decoration:none;color:var(--mute);font-weight:500}
nav a:hover,nav a:focus-visible{color:var(--fg)}
header{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--s5);align-items:end}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--fg)}
.kpi{padding:var(--s3) var(--s3) 0 0}
.kpi b{display:block;font:600 var(--t5)/1 var(--f-num);font-variant-numeric:tabular-nums}
.kpi span{font-size:var(--t1);color:var(--mute)}
.finds{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s5);border-top:1px solid var(--line);padding-top:var(--s4)}
.finds div{display:flex;flex-direction:column;gap:var(--s1)}
.finds big{font:600 var(--t5)/1 var(--f-num);color:var(--accent)}
.finds span{font-size:var(--t2)}
.finds b{color:var(--accent)}
section{display:flex;flex-direction:column;gap:var(--s4);scroll-margin-top:var(--s7)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4);flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:var(--s2)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:var(--s5)}
.chart{background:var(--paper);border:1px solid var(--line);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.bars{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 64px 58px;gap:var(--s1) var(--s3);align-items:center;font-size:var(--t1)}
.bars .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{height:14px;background:var(--soft);position:relative}
.bars .fill{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bars .r{text-align:right}
.bars .cpi.bad{color:var(--warn);font-weight:700}
.bars .hd{color:var(--mute);font-size:var(--t1)}
.legend{font-size:var(--t1);color:var(--mute)}
.filters{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
select,button{font:inherit;font-size:var(--t1);background:var(--paper);color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:var(--s1) var(--s2)}
button{cursor:pointer}
button:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:var(--s3)}
.card{background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;cursor:pointer;min-width:0}
.card .m{aspect-ratio:9/14;background:var(--soft);position:relative;overflow:hidden}
.card .m img{width:100%;height:100%;object-fit:cover;display:block}
.card .m .tag{position:absolute;left:0;top:0;background:var(--fg);color:var(--bg);font:600 var(--t1)/1 var(--f-num);padding:var(--s1) var(--s2)}
.card .m .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:var(--t1);text-align:center;padding:var(--s3)}
.card .b{padding:var(--s2);display:flex;flex-direction:column;gap:2px;font-size:var(--t1)}
.card .b .top{display:flex;justify-content:space-between;gap:var(--s2)}
.card .b .sp{font:600 var(--t3)/1.1 var(--f-num)}
.pill{display:inline-block;font-size:var(--t1);padding:0 var(--s1);border:1px solid var(--accent);color:var(--accent);border-radius:2px}
.more{align-self:center}
.chip{display:inline-block;font:600 var(--t1)/1.4 var(--f-num);padding:0 var(--s1);border-radius:2px;font-variant-numeric:tabular-nums}
.chip.good{background:var(--accent-soft);color:var(--accent)}
.chip.bad{background:var(--warn-soft);color:var(--warn)}
.chip.mid{background:var(--soft);color:var(--mute)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);border-radius:0;padding:var(--s1) var(--s3);font-size:var(--t2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.learn{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s4)}
.lcard{background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;cursor:pointer;min-width:0}
.lcard .m{aspect-ratio:9/13;position:relative;background:var(--soft);overflow:hidden}
.lcard .m img{width:100%;height:100%;object-fit:cover;display:block}
.lcard .m .rk{position:absolute;left:0;top:0;background:var(--accent);color:var(--paper);font:600 var(--t2)/1 var(--f-num);padding:var(--s2)}
.lcard .m .play{position:absolute;right:var(--s2);bottom:var(--s2);background:var(--fg);color:var(--bg);font-size:var(--t1);padding:var(--s1) var(--s2)}
.lcard .b{padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.lcard .nums{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.lcard .nums b{font:600 var(--t4)/1.1 var(--f-num);display:block}
.lcard .nums span{font-size:var(--t1);color:var(--mute)}
.lcard .why{font-size:var(--t1);color:var(--mute)}
.scatter{background:var(--paper);border:1px solid var(--line);padding:var(--s4);overflow-x:auto}
.scatter svg{display:block;width:100%;min-width:620px;height:auto}
.scatter circle{cursor:pointer}
.keys{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:var(--t1);color:var(--mute)}
.keys i{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:var(--s1);vertical-align:-1px}
.tbl{overflow-x:auto;border:1px solid var(--line);background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:var(--t1)}
th,td{padding:var(--s1) var(--s2);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--soft);font-weight:700}
tbody tr+tr td{border-top:1px solid var(--soft)}
td.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
td img{width:44px;height:58px;object-fit:cover;display:block;cursor:zoom-in}
.heat{display:inline-block;min-width:36px;text-align:right;padding:0 var(--s1)}
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:var(--s2)}
.samples img{width:100%;aspect-ratio:9/14;object-fit:cover;cursor:zoom-in;background:var(--soft);display:block}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:var(--s5)}
#lb{position:fixed;inset:0;background:rgba(18,24,29,.9);z-index:20;display:flex;align-items:center;justify-content:center;gap:var(--s5);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
#lb .media{max-height:86vh;max-width:min(92vw,560px)}
#lb video,#lb img{max-height:86vh;max-width:100%;display:block;background:#12181d}
#lb .info{color:#e4e8e3;max-width:340px;display:flex;flex-direction:column;gap:var(--s2);font-size:var(--t2)}
#lb .info a{color:#4fbfae}
#lb .x{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));background:transparent;color:#e4e8e3;border:1px solid #e4e8e3;font-size:var(--t2)}
@media (max-width:720px){header{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.bars{grid-template-columns:minmax(80px,120px) minmax(0,1fr) 56px 48px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="wrap">
<nav aria-label="页面目录"><a href="#learn">最值得借鉴</a><a href="#map">全盘一张图</a><a href="#pan">分类对比</a><a href="#wall">素材墙</a><a href="#market">大盘在投什么</a><a href="#inhouse">内部投放周表</a></nav>

<header>
  <div>
    <h1>PUGC 投放素材盘点</h1>
    <p class="mute">美区同盘子 702 条素材，飞书投放数据表 11-17 导出</p>
  </div>
  <div class="kpis" id="kpis"></div>
</header>

<div class="finds" id="finds"></div>

<section id="learn">
  <div class="sechead"><h2>最值得借鉴</h2><span class="legend">消耗过 $1,500 且 CPI 低于均值，按 CPI 排</span></div>
  <div class="learn" id="learnV"></div>
  <div class="sechead"><h3>图文</h3><span class="legend">消耗过 $150 且 CPI 低于均值</span></div>
  <div class="learn" id="learnI"></div>
</section>

<section id="map">
  <div class="sechead"><h2>全盘一张图</h2><span class="legend">右下角 = 花得多又便宜</span></div>
  <div class="scatter" id="scatter"></div>
  <div class="keys" id="keys"></div>
</section>

<section id="pan">
  <div class="sechead"><h2>分类对比</h2><span class="legend">条形 = 消耗；CPI 绿 = 低于均值，橙 = 贵 30% 以上</span></div>
  <div class="charts" id="charts"></div>
</section>

<section id="wall">
  <div class="sechead"><h2>素材墙</h2><span class="legend" id="wallnote"></span></div>
  <div class="filters">
    <select id="fScene" aria-label="场景"></select>
    <select id="fC2" aria-label="二级分类"></select>
    <select id="fType" aria-label="类型"><option value="">视频和图片</option><option>视频</option><option>图片</option></select>
    <span class="seg" role="group" aria-label="排序"><button data-s="spend" aria-pressed="true">消耗 高→低</button><button data-s="cpi" aria-pressed="false">CPI 低→高</button><button data-s="cpihi" aria-pressed="false">CPI 高→低</button><button data-s="inst" aria-pressed="false">新增 多→少</button><button data-s="up" aria-pressed="false">上传 新→旧</button></span>
    <label class="legend"><input type="checkbox" id="fMin" checked> 只看消耗 ≥ $200</label>
    <span class="legend" id="fCount"></span>
  </div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more">再看 60 条</button>
</section>

<section id="market">
  <div class="sechead"><h2>大盘在投什么</h2><span class="legend">只有条数，没有消耗</span></div>
  <div class="two" id="mkt"></div>
  <div id="mktSamples" style="display:flex;flex-direction:column;gap:var(--s4)"></div>
</section>

<section id="inhouse">
  <div class="sechead"><h2>内部投放周表</h2><span class="legend">点缩略图看大图</span></div>
  <div class="two">
    <div class="chart"><h3>2611W2 各素材消耗（多国合计）</h3><div class="tbl" style="max-height:520px;overflow:auto"><table id="tW2"></table></div></div>
    <div class="chart"><h3>2610W3–W5 自投素材效果</h3><div class="tbl" style="max-height:520px;overflow:auto"><table id="tIn"></table></div></div>
  </div>
</section>
</div>

<div id="lb" hidden role="dialog" aria-modal="true" aria-label="素材预览"><button class="x" id="lbx">关闭</button><div class="media" id="lbm"></div><div class="info" id="lbi"></div></div>

<script>
const $=s=>document.querySelector(s);
const fmt=n=>n==null?'–':n>=1000?'$'+(n/1000).toFixed(n>=100000?0:1)+'k':'$'+Math.round(n);
const fi=n=>n==null?'–':Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const cp=n=>n==null?'–':'$'+n.toFixed(1);
let D;
fetch('data.json').then(r=>r.json()).then(d=>{D=d;init()});
function init(){
  const P=D.pan,T=P.total;
  $('#kpis').innerHTML=[['素材条数',fi(T.n)],['消耗',fmt(T.spend)],['新增用户',fi(T.inst)],['平均 CPI',cp(T.cpi)]].map(([a,b])=>`<div class="kpi"><b class="num">${b}</b><span>${a}</span></div>`).join('');
  const sv=P.scene.find(x=>x.k==='shortvideo'),ip=P.scene.find(x=>x.k==='ip');
  const d1=P.dur.find(x=>x.k==='10–20秒'),d6=P.dur.find(x=>x.k==='60秒以上');
  const r916=P.ratio.find(x=>x.k==='9:16 竖屏'),img=P.type.find(x=>x.k==='图片');
  const cet=P.c2.find(x=>x.k.startsWith('Culture')),life=P.c2.find(x=>x.k==='Lifestyle');
  const won=P.items.filter(i=>i.verdict&&i.verdict!=='无效素材').length;
  $('#finds').innerHTML=[
    [(P.top10share*100).toFixed(0)+'%', '的钱花在消耗前 10 条上'],
    [cp(sv.cpi), 'shortvideo 的 CPI，各场景最低'],
    [cp(d1.cpi), '10–20 秒视频的 CPI，各时长最低']
  ].map(([b,t])=>`<div><big>${b}</big><span>${t}</span></div>`).join('');
  const charts=[['场景',P.scene],['二级分类（前 14）',P.c2.slice(0,14)],['时长',P.dur],['画幅',P.ratio],['类型',P.type]];
  $('#charts').innerHTML=charts.map(([t,rows])=>chart(t,rows,T)).join('');
  // filters
  const opts=(arr,all)=>`<option value="">${all}</option>`+arr.map(x=>`<option>${x.k}</option>`).join('');
  $('#fScene').innerHTML=opts(P.scene,'全部场景');$('#fC2').innerHTML=opts(P.c2,'全部二级分类');
  ['#fScene','#fC2','#fType','#fMin'].forEach(s=>$(s).addEventListener('change',()=>{shown=60;wall()}));
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));sortBy=b.dataset.s;shown=60;wall()});
  learn();scatter();
  $('#more').addEventListener('click',()=>{shown+=60;wall()});
  const hv=P.items.filter(i=>i.v).length;
  $('#wallnote').textContent=`前 ${hv} 条视频可直接播放`;
  wall();market();inhouse();
}
function chart(title,rows,T){
  const max=Math.max(...rows.map(r=>r.spend));
  return `<div class="chart"><h3>${title}</h3><div class="bars"><span class="hd">分类</span><span class="hd">消耗</span><span class="hd r">消耗</span><span class="hd r">CPI</span>`+
  rows.map(r=>`<span class="lab" title="${r.k}">${r.k} <span class="mute">${r.n}条</span></span><span class="track"><span class="fill" style="width:${(r.spend/max*100).toFixed(1)}%"></span></span><span class="r num">${fmt(r.spend)}</span><span class="r">${chip(r.cpi)}</span>`).join('')+`</div></div>`;
}
let shown=60,sortBy='spend';
const chip=c=>{const a=D.pan.total.cpi;return c==null?'<span class="chip mid">–</span>':`<span class="chip ${c<=a?'good':c>a*1.3?'bad':'mid'}">${cp(c)}</span>`};
function wall(){
  const s=$('#fScene').value,c=$('#fC2').value,t=$('#fType').value,mn=$('#fMin').checked;
  let L=D.pan.items.filter(i=>(!s||i.scene===s)&&(!c||i.c2===c)&&(!t||i.type===t)&&(!mn||i.spend>=200));
  const o=sortBy;
  if(o==='cpi') L=L.filter(i=>i.cpi!=null).sort((a,b)=>a.cpi-b.cpi);
  else if(o==='cpihi') L=L.filter(i=>i.cpi!=null).sort((a,b)=>b.cpi-a.cpi);
  else if(o==='inst') L=[...L].sort((a,b)=>b.inst-a.inst);
  else if(o==='up') L=[...L].sort((a,b)=>(b.up||'').localeCompare(a.up||''));
  $('#fCount').textContent=`${L.length} 条`;
  $('#grid').innerHTML=L.slice(0,shown).map((i,k)=>{
    const th=i.t||i.i;
    const m=th?`<img loading="lazy" src="${th}" alt="${i.c2} 素材封面">`:`<div class="none">${i.type}<br>点开到变色龙查看</div>`;
    return `<div class="card" tabindex="0" data-cid="${i.cid}"><div class="m">${m}<span class="tag">${i.v?"视频 ":""}#${D.pan.items.indexOf(i)+1}</span></div><div class="b"><div class="top"><span class="sp num">${fmt(i.spend)}</span><span>CPI ${chip(i.cpi)}</span></div><span>${i.scene} / ${i.c2}</span><span class="mute">${i.type}${i.dur?` ${i.dur}秒`:''} ${i.size}${i.verdict&&i.verdict!=='无效素材'?` <span class="pill">${i.verdict}</span>`:''}</span></div></div>`}).join('');
  $('#more').hidden=L.length<=shown;
  document.querySelectorAll('.card').forEach(el=>{const go=()=>openItem(D.pan.items.find(x=>x.cid===el.dataset.cid));el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}});
}
function learn(){
  const P=D.pan,a=P.total.cpi;
  const V=P.items.filter(i=>i.type==='视频'&&i.spend>=1500&&i.cpi!=null&&i.cpi<=a).sort((x,y)=>x.cpi-y.cpi);
  const seen=new Set();const I=P.items.filter(i=>i.type==='图片'&&i.spend>=150&&i.cpi!=null&&i.cpi<=a).sort((x,y)=>x.cpi-y.cpi).filter(i=>{const k=i.spend+'|'+i.cpi;if(seen.has(k))return false;seen.add(k);return true});
  const card=(i,k)=>`<div class="lcard" tabindex="0" data-cid="${i.cid}"><div class="m">${(i.t||i.i)?`<img loading="lazy" src="${i.t||i.i}" alt="${i.c2}">`:''}<span class="rk">${k+1}</span><span class="play">${i.v?'播放':'放大'}</span></div><div class="b"><div class="nums"><div><b>${cp(i.cpi)}</b><span>CPI，低 ${Math.round((1-i.cpi/a)*100)}%</span></div><div><b>${fmt(i.spend)}</b><span>消耗</span></div></div><span class="why">${i.scene} / ${i.c2}${i.dur?`，${Math.round(i.dur)} 秒`:''}</span></div></div>`;
  $('#learnV').innerHTML=V.map(card).join('');$('#learnI').innerHTML=I.map(card).join('');
  document.querySelectorAll('.lcard').forEach(el=>{const go=()=>openItem(P.items.find(x=>x.cid===el.dataset.cid));el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}});
}
function scatter(){
  const P=D.pan,a=P.total.cpi,pts=P.items.filter(i=>i.spend>=50&&i.cpi!=null&&i.inst>=1);
  const W=1000,H=420,L=56,R=16,T=16,B=40,xmin=Math.log10(50),xmax=Math.log10(60000),ymax=200;
  const X=v=>L+(Math.log10(v)-xmin)/(xmax-xmin)*(W-L-R),Y=v=>T+(1-Math.min(v,ymax)/ymax)*(H-T-B);
  const col={shortvideo:'var(--accent)',ip:'var(--fg)','creative&social':'var(--warn)',live:'var(--mute)'};
  let g='';
  [100,1000,10000].forEach(v=>g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}" stroke="var(--line)"/><text x="${X(v)}" y="${H-B+18}" text-anchor="middle" font-size="12" fill="var(--mute)">${fmt(v)}</text>`);
  [0,50,100,150,200].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--soft)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--mute)">$${v}${v===200?'+':''}</text>`);
  g+=`<line x1="${L}" x2="${W-R}" y1="${Y(a)}" y2="${Y(a)}" stroke="var(--fg)" stroke-dasharray="4 4"/><text x="${W-R}" y="${Y(a)-6}" text-anchor="end" font-size="12" fill="var(--fg)">均值 ${cp(a)}</text>`;
  g+=`<text x="${W-R-4}" y="${H-B-8}" text-anchor="end" font-size="14" font-weight="700" fill="var(--accent)">花得多又便宜</text><text x="${W-R-4}" y="${T+14}" text-anchor="end" font-size="13" fill="var(--warn)">花得多但贵</text><text x="${L+6}" y="${H-B-8}" font-size="13" fill="var(--mute)">便宜但没放量</text>`;
  g+=pts.map(i=>`<circle cx="${X(i.spend).toFixed(1)}" cy="${Y(i.cpi).toFixed(1)}" r="${(3+Math.sqrt(i.spend)/30).toFixed(1)}" fill="${col[i.scene]||'var(--mute)'}" fill-opacity=".6" stroke="var(--paper)" data-cid="${i.cid}"><title>${fmt(i.spend)}，CPI ${cp(i.cpi)}，${i.scene} / ${i.c2}</title></circle>`).join('');
  g+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle" font-size="12" fill="var(--mute)">消耗（对数刻度）</text>`;
  $('#scatter').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="素材消耗与 CPI 散点图">${g}</svg>`;
  $('#keys').innerHTML=Object.entries(col).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join('')+'<span>点越大花得越多，点击看原片</span>';
  document.querySelectorAll('#scatter circle').forEach(el=>el.onclick=()=>openItem(P.items.find(x=>x.cid===el.dataset.cid)));
}
function openItem(i){
  let m='';
  if(i.v) m=`<video src="${i.v}" controls autoplay muted playsinline></video>`;
  else if(i.i) m=`<img src="${i.i}" alt="素材大图">`;
  else m=`<div style="color:#e4e8e3;padding:24px">这条没有存到本页，点右侧变色龙链接查看</div>`;
  lb(m,`<b class="num" style="font-size:21px">${fmt(i.spend)}</b><span>新增 ${fi(i.inst)}，CPI ${cp(i.cpi)}</span><span>${i.scene} / ${i.c1} / ${i.c2}</span><span>${i.type} ${i.size}${i.dur?`，${i.dur} 秒`:""}，上传 ${i.up}</span><span>${i.verdict||''} ${i.seg?`（成本${i.seg}）`:''}</span>${i.gid?`<a href="https://www.tiktok.com/@/video/${i.gid}" target="_blank" rel="noopener">TikTok 原帖 ${i.gid}</a>`:''}${i.url?`<a href="${i.url}" target="_blank" rel="noopener">在变色龙打开原片（需登录）</a>`:''}<span class="mute" style="color:#9aa5ad">CID ${i.cid}</span>`);
}
function lb(m,info){$('#lbm').innerHTML=m;$('#lbi').innerHTML=info;$('#lb').hidden=false;$('#lbx').focus()}
function closeLb(){$('#lb').hidden=true;$('#lbm').innerHTML=''}
$('#lbx').onclick=closeLb;$('#lb').onclick=e=>{if(e.target.id==='lb')closeLb()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});
function market(){
  const html=Object.values(D.dp).map(s=>{
    const max=Math.max(...s.scene.map(x=>x[1]));
    return `<div class="chart"><h3>${s.name} <span class="mute">${fi(s.n)} 条</span></h3><div class="bars" style="grid-template-columns:minmax(90px,150px) minmax(0,1fr) 52px 52px"><span class="hd">素材类型</span><span class="hd">条数</span><span class="hd r">条数</span><span class="hd r">占比</span>`+
    s.scene.map(([k,v])=>`<span class="lab">${k}</span><span class="track"><span class="fill" style="width:${(v/max*100).toFixed(1)}%"></span></span><span class="r num">${fi(v)}</span><span class="r num">${(v/s.n*100).toFixed(0)}%</span>`).join('')+
    `</div><span class="legend">地区前几：${s.region.slice(0,6).map(([k,v])=>`${k==='NULL'?'未填':k} ${v}`).join('，')}</span></div>`}).join('');
  $('#mkt').innerHTML=html;
  const sm=D.dp.vukoLd.samples;
  $('#mktSamples').innerHTML='<h3>大盘 10/26–10/31 各类型样例（点开放大）</h3>'+Object.entries(sm).map(([k,arr])=>`<div><div class="legend" style="margin-bottom:4px">${k}</div><div class="samples">${arr.map(a=>`<img loading="lazy" src="${a.i}" alt="${k} 样例" data-v="${a.v}" data-rg="${a.rg}">`).join('')}</div></div>`).join('');
  document.querySelectorAll('.samples img').forEach(el=>el.onclick=()=>lb(`<img src="${el.getAttribute('src')}" alt="样例大图">`,`<span>${el.alt}</span><span>地区 ${el.dataset.rg}</span>${el.dataset.v?`<a href="${el.dataset.v}" target="_blank" rel="noopener">在变色龙打开视频（需登录）</a>`:''}`));
}
function inhouse(){
  const th=(a)=>a.t||a.i;
  $('#tW2').innerHTML='<thead><tr><th></th><th>素材</th><th>国家</th><th>消耗</th></tr></thead><tbody>'+D.w2.map((a,k)=>`<tr><td>${th(a)?`<img loading="lazy" src="${th(a)}" alt="封面" data-k="w${k}">`:''}</td><td>${a.name}</td><td>${a.regs.join(' ')}</td><td class="n">${fmt(a.spend)}</td></tr>`).join('')+'</tbody>';
  const L=[...D.inw].sort((a,b)=>b.inst-a.inst);
  $('#tIn').innerHTML='<thead><tr><th></th><th>周</th><th>素材</th><th>新增</th><th>CPI</th><th>判断</th></tr></thead><tbody>'+L.map((a,k)=>`<tr><td>${th(a)?`<img loading="lazy" src="${th(a)}" alt="封面" data-k="i${k}">`:''}</td><td>${a.wk}</td><td>${(a.name||a.tag||a.cid).slice(0,34)}</td><td class="n">${fi(a.inst)}</td><td class="n">${cp(a.cpi)}</td><td>${a.ver}</td></tr>`).join('')+'</tbody>';
  const pick=k=>k[0]==='w'?D.w2[+k.slice(1)]:L[+k.slice(1)];
  document.querySelectorAll('#tW2 img,#tIn img').forEach(el=>el.onclick=()=>{const a=pick(el.dataset.k);
    lb(a.v?`<video src="${a.v}" controls autoplay muted playsinline></video>`:`<img src="${a.i||a.t}" alt="封面大图">`,`<span>${a.wk} ${a.name||a.tag||''}</span>${a.spend!=null?`<b class="num">${fmt(a.spend)}</b>`:`<span>新增 ${fi(a.inst)}，CPI ${cp(a.cpi)}</span>`}${a.url?`<a href="${a.url}" target="_blank" rel="noopener">在变色龙打开视频（需登录）</a>`:''}`)});
}
</script>
</body></html>
