<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>PUGC 投放素材盘点</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* 布局：左右两栏。左栏 = 盘点结论（列点 + 小表小图，桌面端单独滚动）；右栏 = 借鉴前 10（按钮切换视频/图文）+ 素材墙（多条件筛选 + 排序） */
/* 旋钮：变化度 5 · 动效 1 · 密度 8 */
:root{
  --bg:#f3f4f1; --paper:#fbfbf9; --fg:#16212b; --mute:#5b6670; --line:#d9ddd6; --soft:#e8ebe5;
  --accent:#0b7a6e; --accent-soft:#d3ebe6; --warn:#b4521e; --warn-soft:#f5e1d6;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"IBM Plex Sans Condensed","Noto Sans SC",system-ui,sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --t1:12px;--t2:14px;--t3:17px;--t4:21px;--t5:32px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181d;--paper:#182027;--fg:#e4e8e3;--mute:#9aa5ad;--line:#2c3740;--soft:#212b33;
  --accent:#4fbfae;--accent-soft:#1d3a37;--warn:#e08a5c;--warn-soft:#3a2a21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181d;--paper:#182027;--fg:#e4e8e3;--mute:#9aa5ad;--line:#2c3740;--soft:#212b33;
  --accent:#4fbfae;--accent-soft:#1d3a37;--warn:#e08a5c;--warn-soft:#3a2a21;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 var(--t2)/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s4)}
h1{font:700 var(--t4)/1.2 var(--f-body);margin:0}
h2{font:700 var(--t3)/1.3 var(--f-body);margin:0}
.mute{color:var(--mute)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:minmax(340px,5fr) minmax(0,9fr);gap:var(--s5);max-width:1680px;margin:0 auto;height:100%}
.left{overflow-y:auto;min-width:0;display:flex;flex-direction:column;gap:var(--s5);padding-right:var(--s3);border-right:1px solid var(--line)}
.right{overflow-y:auto;min-width:0;display:flex;flex-direction:column;gap:var(--s5)}
.blk{display:flex;flex-direction:column;gap:var(--s2)}
.blk>h2{border-bottom:2px solid var(--fg);padding-bottom:var(--s1)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.kpi b{display:block;font:600 var(--t4)/1.1 var(--f-num)}
.kpi span{font-size:var(--t1);color:var(--mute)}
ol.pts{margin:0;padding-left:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
ol.pts li b{color:var(--accent)}
.bars{display:grid;grid-template-columns:minmax(80px,1.2fr) minmax(0,1.6fr) 52px 54px;gap:var(--s1) var(--s2);align-items:center;font-size:var(--t1)}
.bars .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{height:12px;background:var(--soft);position:relative}
.bars .fill{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bars .r{text-align:right}
.bars .hd{color:var(--mute)}
.chip{display:inline-block;font:600 var(--t1)/1.4 var(--f-num);padding:0 var(--s1);border-radius:2px;font-variant-numeric:tabular-nums}
.chip.good{background:var(--accent-soft);color:var(--accent)}
.chip.bad{background:var(--warn-soft);color:var(--warn)}
.chip.mid{background:var(--soft);color:var(--mute)}
.scatter{background:var(--paper);border:1px solid var(--line);padding:var(--s2)}
.scatter svg{display:block;width:100%;height:auto}
.scatter circle{cursor:pointer}
.keys{display:flex;gap:var(--s3);flex-wrap:wrap;font-size:var(--t1);color:var(--mute)}
.keys i{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:var(--s1)}
.tbl{overflow:auto;border:1px solid var(--line);background:var(--paper);max-height:320px}
table{border-collapse:collapse;width:100%;font-size:var(--t1)}
th,td{padding:var(--s1) var(--s2);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--soft);font-weight:700}
tbody tr+tr td{border-top:1px solid var(--soft)}
td.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
td img{width:36px;height:48px;object-fit:cover;display:block;cursor:zoom-in}
.bar-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:var(--s2)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{font:inherit;font-size:var(--t1);background:var(--paper);color:var(--fg);border:0;border-right:1px solid var(--line);padding:var(--s1) var(--s3);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.top10{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s3)}
.lcard,.card{background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;cursor:pointer;min-width:0}
.lcard .m,.card .m{aspect-ratio:9/13;position:relative;background:var(--soft);overflow:hidden}
.lcard .m img,.card .m img{width:100%;height:100%;object-fit:cover;display:block}
.rk{position:absolute;left:0;top:0;background:var(--accent);color:var(--paper);font:600 var(--t2)/1 var(--f-num);padding:var(--s2)}
.card .rk{background:var(--fg);color:var(--bg);font-size:var(--t1);padding:var(--s1) var(--s2)}
.play{position:absolute;right:var(--s1);bottom:var(--s1);background:var(--fg);color:var(--bg);font-size:var(--t1);padding:0 var(--s1)}
.none{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:var(--t1);text-align:center;padding:var(--s3)}
.lcard .b,.card .b{padding:var(--s2);display:flex;flex-direction:column;gap:var(--s1);font-size:var(--t1)}
.lcard .nums{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.lcard .nums b{font:600 var(--t3)/1.1 var(--f-num)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.card .sp{font:600 var(--t2)/1.1 var(--f-num)}
.sub{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s2)}
.filters label{display:flex;flex-direction:column;gap:2px;font-size:var(--t1);color:var(--mute)}
select,input[type=search],input[type=number]{font:inherit;font-size:var(--t1);background:var(--paper);color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:var(--s1) var(--s2);width:100%}
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;font-size:var(--t1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
.more,.reset{font:inherit;font-size:var(--t1);background:var(--paper);color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:var(--s1) var(--s3);cursor:pointer}
.more{align-self:center}
button:focus-visible,select:focus-visible,input:focus-visible,.card:focus-visible,.lcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:var(--s1)}
.samples img{width:100%;aspect-ratio:9/14;object-fit:cover;cursor:zoom-in;background:var(--soft);display:block}
details summary{cursor:pointer;font-weight:700}
#lb{position:fixed;inset:0;background:rgba(18,24,29,.9);z-index:20;display:flex;align-items:center;justify-content:center;gap:var(--s5);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
#lb .media{max-height:86vh;max-width:min(92vw,560px)}
#lb video,#lb img{max-height:86vh;max-width:100%;display:block;background:#12181d}
#lb .info{color:#e4e8e3;max-width:340px;display:flex;flex-direction:column;gap:var(--s2);font-size:var(--t2)}
#lb .info a{color:#4fbfae}
#lb .x{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));background:transparent;color:#e4e8e3;border:1px solid #e4e8e3;font:inherit;padding:var(--s1) var(--s3);cursor:pointer}
@media (max-width:1100px){.top10{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){html,body{height:auto}.app{grid-template-columns:1fr;height:auto}.left,.right{overflow:visible;border-right:0;padding-right:0}.top10{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="app">
<aside class="left" aria-label="盘点结论">
  <div class="blk">
    <h1>PUGC 投放素材盘点</h1>
    <span class="mute">飞书「数据反馈」表 11-17 导出</span>
    <div class="mute" style="font-size:12px">同盘子（美区大盘）</div>
    <div class="kpis" id="kpis"></div>
    <div class="mute" style="font-size:12px">内部投放 2611W2（表里只有消耗，没有新增和 CPI）</div>
    <div class="kpis" id="kpis2"></div>
  </div>
  <div class="blk"><h2>结论</h2><ol class="pts" id="pts"></ol></div>
  <div class="blk"><h2>全盘一张图</h2><span class="mute" style="font-size:12px">一个点一条素材；右下角 = 花得多又便宜，点开看原片</span><div class="scatter" id="scatter"></div><div class="keys" id="keys"></div></div>
  <div class="blk"><h2>按场景</h2><div id="cScene"></div></div>
  <div class="blk"><h2>按时长</h2><div id="cDur"></div></div>
  <div class="blk"><h2>按二级分类（前 12）</h2><div id="cC2"></div></div>
  <div class="blk"><h2>按画幅与类型</h2><div id="cRatio"></div><div id="cType"></div></div>
  <details class="blk" id="dMkt"><summary>大盘在投什么（只有条数）</summary><div id="mkt" style="display:flex;flex-direction:column;gap:var(--s4);margin-top:var(--s3)"></div><button class="reset fold" data-d="dMkt">收起</button></details>
  <details class="blk" id="dIn"><summary>内部投放周表（也已并入右侧素材墙）</summary><div style="display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s3)"><div class="tbl"><table id="tW2"></table></div><div class="tbl"><table id="tIn"></table></div><button class="reset fold" data-d="dIn">收起</button></div></details>
</aside>

<main class="right">
  <section class="blk" aria-label="最值得借鉴">
    <div class="bar-head"><h2>最值得借鉴前 10</h2>
      <span class="seg" role="group" aria-label="借鉴类型"><button data-k="v" aria-pressed="true">视频</button><button data-k="i" aria-pressed="false">图文</button></span>
    </div>
    <span class="mute" style="font-size:12px" id="t10note"></span>
    <div class="top10" id="top10"></div>
  </section>

  <section class="blk" aria-label="素材墙">
    <div class="bar-head"><h2>素材墙 <span class="mute num" id="fCount"></span></h2>
      <span class="seg" role="group" aria-label="来源" id="srcSeg"><button data-v="" aria-pressed="true">全部</button><button data-v="同盘子" aria-pressed="false">同盘子</button><button data-v="内部" aria-pressed="false">内部投放</button></span>
      <span class="seg" role="group" aria-label="排序" id="sortSeg"><button data-s="cpi" aria-pressed="false">CPI</button><button data-s="spend" aria-pressed="true">消耗</button><button data-s="inst" aria-pressed="false">新增用户</button></span>
      <span class="seg" role="group" aria-label="方向" id="dirSeg"><button data-d="desc" aria-pressed="true">降序</button><button data-d="asc" aria-pressed="false">升序</button></span>
    </div>
    <span class="mute" style="font-size:12px" id="wallNote">按 CPI 排时只算消耗满 $200 的素材</span>
    <div class="grid" id="grid"></div>
    <button class="more" id="more">再看 60 条</button>
  </section>
</main>
</div>

<div id="lb" hidden role="dialog" aria-modal="true" aria-label="素材预览"><button class="x" id="lbx">关闭</button><div class="media" id="lbm"></div><div class="info" id="lbi"></div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const fmt=n=>n==null?'–':n>=1000?'$'+(n/1000).toFixed(n>=100000?0:1)+'k':'$'+Math.round(n);
const fi=n=>n==null?'–':Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const cp=n=>n==null?'–':'$'+n.toFixed(1);
const durB=i=>i.type!=='视频'?'图片':!i.dur?'未知':i.dur<=10?'≤10秒':i.dur<=20?'10–20秒':i.dur<=40?'20–40秒':i.dur<=60?'40–60秒':'60秒以上';
const ratioB=i=>{const m=(i.size||'').split('x').map(Number);if(m.length<2||!m[1])return'其他';const r=m[0]/m[1];return r<0.6?'9:16 竖屏':r<0.9?'4:5':r<1.1?'1:1 方图':'横屏'};
let D,AVG,shown=60,sortBy='spend',dir='desc',t10='v',SRC='';
const lvl=c=>c==null?'none':c<=AVG?'good':c>AVG*1.3?'bad':'mid';
const chip=c=>`<span class="chip ${lvl(c)==='none'?'mid':lvl(c)}">${cp(c)}</span>`;
fetch('data.json').then(r=>r.json()).then(d=>{D=d;AVG=d.pan.total.cpi;
  D.pan.items.forEach((i,k)=>{i.rank=k+1;i.src='同盘子';i.lab='#'+(k+1)});
  const tagSplit=t=>{const p=(t||'').split(' / ');return [p[0]||'未标',p[1]||p[0]||'未标']};
  const inw=D.inw.map(a=>{const [c1,c2]=tagSplit(a.tag);const nm=(a.name||'');return {...a,src:a.wk,lab:a.wk.slice(4),type:/图片/.test(nm)?'图片':'视频',spend:Math.round(a.inst*a.cpi*100)/100,scene:'内部投放',c1,c2,verdict:a.ver,size:'',dur:0,up:'',gid:''}});
  const w2=D.w2.map(a=>({...a,src:'2611W2',lab:'W2',type:/图片/.test(a.name)?'图片':'视频',inst:null,cpi:null,scene:'内部投放',c1:'未标',c2:'未标',verdict:'',size:'',dur:0,up:'',gid:'',ver:''}));
  const order={'2610W3':1,'2610W4':2,'2610W5':3,'2611W2':4};
  const latest=new Map();
  inw.forEach(i=>{const o=latest.get(i.cid);if(!o||order[i.src]>order[o.src])latest.set(i.cid,{...i,weeks:[...(o?o.weeks:[]),i.src]});else o.weeks.push(i.src)});
  const w2keep=[];w2.forEach(i=>{const o=latest.get(i.cid);if(o){o.weeks.push('2611W2');o.w2spend=i.spend}else w2keep.push({...i,weeks:['2611W2']})});
  const pz=new Set(D.pan.items.map(i=>i.cid));
  const inMerged=[...latest.values()].filter(i=>!pz.has(i.cid));
  D.all=[...D.pan.items,...inMerged,...w2keep];
  D.dupNote=`内部 ${inw.length} 行合并成 ${latest.size} 条（同一 CID 多周出现只留最新一周）`;
  D.all.forEach((i,k)=>{i.ix=k;i.db=durB(i);i.rb=ratioB(i);i.age=i.up?Math.round((Date.parse('2026-11-17')-Date.parse(i.up))/864e5):null;i.ab=ageB(i.age)});
  init()});
function ageB(a){return a==null?'未知':a<=30?'30天内':a<=60?'31–60天':a<=120?'61–120天':a<=180?'121–180天':'180天以上'}
function bars(rows){
  const max=Math.max(...rows.map(r=>r.spend));
  return `<div class="bars"><span class="hd"></span><span class="hd">消耗</span><span class="hd r"></span><span class="hd r">CPI</span>`+
  rows.map(r=>`<span class="lab" title="${r.k}">${r.k} <span class="mute">${r.n}</span></span><span class="track"><span class="fill" style="width:${(r.spend/max*100).toFixed(1)}%"></span></span><span class="r num">${fmt(r.spend)}</span><span class="r">${chip(r.cpi)}</span>`).join('')+`</div>`;
}
function init(){
  const P=D.pan,T=P.total;
  $('#kpis').innerHTML=[['条素材',fi(T.n)],['消耗',fmt(T.spend)],['新增用户',fi(T.inst)],['平均 CPI',cp(T.cpi)]].map(([a,b])=>`<div class="kpi"><b class="num">${b}</b><span>${a}</span></div>`).join('');
  const g=(arr,k)=>arr.find(x=>x.k===k)||{};
  const sv=g(P.scene,'shortvideo'),ip=g(P.scene,'ip'),d1=g(P.dur,'10–20秒'),d6=g(P.dur,'60秒以上'),r9=g(P.ratio,'9:16 竖屏'),img=g(P.type,'图片');
  const cet=P.c2.find(x=>x.k.startsWith('Culture')),life=g(P.c2,'Lifestyle');
  const IN=D.all.filter(i=>i.src!=='同盘子'&&i.src!=='2611W2'&&i.inst>0&&i.cpi>0),iS=IN.reduce((a,i)=>a+i.spend,0),iI=IN.reduce((a,i)=>a+i.inst,0),iC=iI?iS/iI:null;
  const w2s=D.all.filter(i=>i.src==='2611W2').reduce((a,i)=>a+i.spend,0);
  const W2=D.w2,w2all=W2.reduce((a,i)=>a+i.spend,0);
  $('#kpis2').innerHTML=[['条素材',fi(W2.length)],['消耗',fmt(w2all)],['新增用户','表里没有'],['平均 CPI','表里没有']].map(([a,b])=>`<div class="kpi"><b class="num">${b}</b><span>${a}</span></div>`).join('');
  const inGood=IN.filter(i=>i.cpi<=AVG).length;
  $('#pts').innerHTML=[
    `<b>内部投放比大盘便宜得多</b>：10 月 W3–W5 去重后 ${IN.length} 条平均 CPI ${cp(iC)}，大盘 ${cp(T.cpi)}；跑得最好的是顶部字幕＋反应图的情侣梗`,
    `<b>钱很集中</b>：前 10 条吃掉 ${(P.top10share*100).toFixed(0)}% 的消耗。第 1、5 名都是真人对镜讲 TikTok Pro 赚积分换券，合计 ${fmt(P.items[0].spend+P.items[4].spend)}`,
    `<b>shortvideo 最划算</b>：CPI ${cp(sv.cpi)}，ip 类 ${cp(ip.cpi)}。ip 里跑得动的是带搜索框的 NFL 集锦`,
    `<b>10–20 秒最好</b>：花了 ${(d1.spend/T.spend*100).toFixed(0)}% 的钱，CPI ${cp(d1.cpi)}；60 秒以上 ${cp(d6.cpi)}`,
    `<b>竖屏为主</b>：9:16 占 ${(r9.spend/T.spend*100).toFixed(0)}% 消耗。图片只花 ${fmt(img.spend)}，CPI ${cp(img.cpi)} 便宜但没放量`,
    `<b>分类</b>：Culture & Education & Tech CPI ${cp(cet.cpi)} 最省；Lifestyle ${cp(life.cpi)}，是均值 ${(life.cpi/T.cpi).toFixed(1)} 倍`
  ].map(t=>`<li>${t}</li>`).join('');
  $('#cScene').innerHTML=bars(P.scene.filter(x=>x.spend>0));$('#cDur').innerHTML=bars(P.dur);$('#cC2').innerHTML=bars(P.c2.slice(0,12));
  $('#cRatio').innerHTML=bars(P.ratio);$('#cType').innerHTML=bars(P.type);
  scatter();market();inhouse();
  $$('.fold').forEach(b=>b.onclick=()=>{const d=document.getElementById(b.dataset.d);d.open=false;d.scrollIntoView({block:'nearest'})});
  let src='';
  $$('#srcSeg button').forEach(b=>b.onclick=()=>{$$('#srcSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));SRC=b.dataset.v;shown=60;wall()});
  $$('#sortSeg button').forEach(b=>b.onclick=()=>{$$('#sortSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));sortBy=b.dataset.s;shown=60;wall()});
  $$('#dirSeg button').forEach(b=>b.onclick=()=>{$$('#dirSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));dir=b.dataset.d;shown=60;wall()});
  $$('[aria-label="借鉴类型"] button').forEach(b=>b.onclick=()=>{$$('[aria-label="借鉴类型"] button').forEach(x=>x.setAttribute('aria-pressed',x===b));t10=b.dataset.k;top10()});
  $('#wallNote').textContent='按 CPI 排时只算消耗满 $200 的素材；'+D.dupNote;
  $('#more').onclick=()=>{shown+=60;wall()};
  top10();wall();
}
function top10(){
  const P=D.pan,seen=new Set();
  const V=t10==='v';
  const L=D.all.filter(i=>(V?i.type==='视频'&&i.spend>=1000:i.type==='图片'&&i.spend>=150)&&i.cpi!=null&&i.cpi<=AVG)
    .sort((x,y)=>x.cpi-y.cpi).filter(i=>{const k=i.spend+'|'+i.cpi;if(seen.has(k))return false;seen.add(k);return true}).slice(0,10);
  $('#t10note').textContent=(V?'消耗过 $1,000':'消耗过 $150')+' 且 CPI 低于同盘子均值，含同盘子和内部投放，按 CPI 从低到高';
  $('#top10').innerHTML=L.map((i,k)=>`<div class="lcard" tabindex="0" data-r="${i.ix}"><div class="m">${(i.t||i.i)?`<img loading="lazy" src="${i.t||i.i}" alt="${i.c2}">`:''}<span class="rk">${k+1}</span><span class="play">${i.v?'播放':'放大'}</span></div><div class="b"><div class="nums"><b>${fmt(i.spend)}</b>${chip(i.cpi)}</div><span class="sub">${i.src==="同盘子"?i.scene:i.src} / ${i.c2}</span><span class="sub">${i.dur?Math.round(i.dur)+' 秒，':''}低于均值 ${Math.round((1-i.cpi/AVG)*100)}%</span><span class="sub">${i.up?i.up.slice(5)+' 上传，上传至今 '+i.age+' 天':''}</span></div></div>`).join('');
  bind('#top10 .lcard');
}
function wall(){
  let L=D.all.filter(i=>!SRC||(SRC==='同盘子'?i.src==='同盘子':i.src!=='同盘子'));
  if(sortBy==='cpi') L=L.filter(i=>i.cpi!=null&&i.spend>=200);
  if(sortBy==='inst') L=L.filter(i=>i.inst!=null);
  const key={spend:i=>i.spend,cpi:i=>i.cpi,inst:i=>i.inst}[sortBy];
  L=[...L].sort((a,b)=>dir==='asc'?key(a)-key(b):key(b)-key(a));
  $('#fCount').textContent=L.length+' 条';
  $('#grid').innerHTML=L.slice(0,shown).map(i=>{
    const th=i.t||i.i;
    return `<div class="card" tabindex="0" data-r="${i.ix}"><div class="m">${th?`<img loading="lazy" src="${th}" alt="${i.c2}">`:`<div class="none">${i.type}<br>到变色龙看</div>`}<span class="rk">${i.lab}</span>${i.v?'<span class="play">播放</span>':''}</div><div class="b"><div class="top"><span class="sp">${fmt(i.spend)}</span>${chip(i.cpi)}</div><span class="sub">${i.src==="同盘子"?i.scene:i.src} / ${i.c2}</span><span class="sub">${i.type}${i.dur?' '+Math.round(i.dur)+'秒':''} ${i.rb}${i.verdict&&i.verdict!=='无效素材'?' '+i.verdict:''}</span><span class="sub">${i.up?i.up.slice(5)+' 上传，上传至今 '+i.age+' 天':i.src==='同盘子'?'上传日期未知':(i.inst!=null?'新增 '+fi(i.inst):(i.regs||[]).join(' '))}</span></div></div>`}).join('');
  $('#more').hidden=L.length<=shown;
  bind('#grid .card');
}
function bind(sel){$$(sel).forEach(el=>{const go=()=>openItem(D.all[+el.dataset.r]);el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}})}
function openItem(i){
  const m=i.v?`<video src="${i.v}" controls autoplay muted playsinline></video>`:(i.i||i.t)?`<img src="${i.i||i.t}" alt="素材大图">`:`<div style="color:#e4e8e3;padding:24px">这条没存到本页，点右侧变色龙链接</div>`;
  lb(m,`<b class="num" style="font-size:21px">${fmt(i.spend)} 消耗，CPI ${cp(i.cpi)}</b>${i.src!=='同盘子'&&i.inst!=null?'<span>消耗 = 新增 × CPI 算出</span>':''}<span>${i.src==='同盘子'?'新增 '+fi(i.inst)+'，同盘子第 '+i.rank+' 名':i.src+' 内部投放'+(i.inst!=null?'，新增 '+fi(i.inst):'')+(i.name?'，'+i.name:'')}</span>${i.weeks&&i.weeks.length>1?'<span>投过的周：'+i.weeks.join('、')+'，这里显示最新一周 '+i.src+' 的数据</span>':''}<span>${i.scene} / ${i.c1} / ${i.c2}</span><span>${i.type} ${i.size}${i.dur?'，'+i.dur+' 秒':''}${i.up?'，'+i.up+' 上传，至 11-17 共 '+i.age+' 天':''}</span><span>${i.verdict||''}</span>${i.gid?`<a href="https://www.tiktok.com/@/video/${i.gid}" target="_blank" rel="noopener">TikTok 原帖</a>`:''}${i.url?`<a href="${i.url}" target="_blank" rel="noopener">变色龙原片（需登录）</a>`:''}<span style="color:#9aa5ad">CID ${i.cid}</span>`);
}
function lb(m,info){$('#lbm').innerHTML=m;$('#lbi').innerHTML=info;$('#lb').hidden=false;$('#lbx').focus()}
function closeLb(){$('#lb').hidden=true;$('#lbm').innerHTML=''}
$('#lbx').onclick=closeLb;$('#lb').onclick=e=>{if(e.target.id==='lb')closeLb()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});
function scatter(){
  const P=D.pan,a=AVG,pts=P.items.filter(i=>i.spend>=50&&i.cpi!=null&&i.inst>=1);
  const W=560,H=320,L=44,R=10,T=12,B=34,xmin=Math.log10(50),xmax=Math.log10(60000),ymax=200;
  const X=v=>L+(Math.log10(v)-xmin)/(xmax-xmin)*(W-L-R),Y=v=>T+(1-Math.min(v,ymax)/ymax)*(H-T-B);
  const col={shortvideo:'var(--accent)',ip:'var(--fg)','creative&social':'var(--warn)',live:'var(--mute)'};
  let g='';
  [100,1000,10000].forEach(v=>g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}" stroke="var(--line)"/><text x="${X(v)}" y="${H-B+14}" text-anchor="middle" font-size="11" fill="var(--mute)">${fmt(v)}</text>`);
  [0,50,100,150,200].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--soft)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">$${v}${v===200?'+':''}</text>`);
  g+=`<line x1="${L}" x2="${W-R}" y1="${Y(a)}" y2="${Y(a)}" stroke="var(--fg)" stroke-dasharray="4 4"/><text x="${W-R}" y="${Y(a)-5}" text-anchor="end" font-size="11" fill="var(--fg)">均值 ${cp(a)}</text>`;
  g+=`<text x="${W-R-4}" y="${H-B-6}" text-anchor="end" font-size="12" font-weight="700" fill="var(--accent)">花得多又便宜</text><text x="${W-R-4}" y="${T+12}" text-anchor="end" font-size="11" fill="var(--warn)">花得多但贵</text>`;
  g+=pts.map(i=>`<circle cx="${X(i.spend).toFixed(1)}" cy="${Y(i.cpi).toFixed(1)}" r="${(2.5+Math.sqrt(i.spend)/40).toFixed(1)}" fill="${col[i.scene]||'var(--mute)'}" fill-opacity=".6" stroke="var(--paper)" data-r="${i.rank}"><title>${fmt(i.spend)}，CPI ${cp(i.cpi)}，${i.scene} / ${i.c2}</title></circle>`).join('');
  g+=`<text x="${(L+W-R)/2}" y="${H-2}" text-anchor="middle" font-size="11" fill="var(--mute)">消耗（对数刻度）</text>`;
  $('#scatter').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="消耗与 CPI 散点图">${g}</svg>`;
  $('#keys').innerHTML=Object.entries(col).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join('');
  $$('#scatter circle').forEach(el=>el.onclick=()=>openItem(D.pan.items[el.dataset.r-1]));
}
function market(){
  $('#mkt').innerHTML=Object.values(D.dp).map(s=>{
    const max=Math.max(...s.scene.map(x=>x[1]));
    return `<div><h2 style="font-size:14px">${s.name} <span class="mute">${fi(s.n)} 条</span></h2><div class="bars" style="grid-template-columns:minmax(80px,1.2fr) minmax(0,1.6fr) 44px 40px">`+
    s.scene.map(([k,v])=>`<span class="lab">${k}</span><span class="track"><span class="fill" style="width:${(v/max*100).toFixed(1)}%"></span></span><span class="r num">${fi(v)}</span><span class="r num">${(v/s.n*100).toFixed(0)}%</span>`).join('')+`</div></div>`}).join('')+
    '<details><summary>10/26–10/31 各类型样例</summary>'+Object.entries(D.dp.vukoLd.samples).map(([k,arr])=>`<div class="mute" style="font-size:12px;margin-top:8px">${k}</div><div class="samples">${arr.map(a=>`<img loading="lazy" src="${a.i}" alt="${k}" data-v="${a.v}" data-rg="${a.rg}">`).join('')}</div>`).join('')+'</details>';
  $$('.samples img').forEach(el=>el.onclick=()=>lb(`<img src="${el.getAttribute('src')}" alt="样例大图">`,`<span>${el.alt}</span><span>地区 ${el.dataset.rg}</span>${el.dataset.v?`<a href="${el.dataset.v}" target="_blank" rel="noopener">变色龙视频（需登录）</a>`:''}`));
}
function inhouse(){
  const th=a=>a.t||a.i;
  $('#tW2').innerHTML='<thead><tr><th></th><th>2611W2 素材</th><th>国家</th><th>消耗</th></tr></thead><tbody>'+D.w2.map((a,k)=>`<tr><td>${th(a)?`<img loading="lazy" src="${th(a)}" alt="封面" data-k="w${k}">`:''}</td><td>${a.name}</td><td>${a.regs.join(' ')}</td><td class="n">${fmt(a.spend)}</td></tr>`).join('')+'</tbody>';
  const L=[...D.inw].sort((a,b)=>b.inst-a.inst);
  $('#tIn').innerHTML='<thead><tr><th></th><th>周</th><th>素材</th><th>新增</th><th>CPI</th><th>判断</th></tr></thead><tbody>'+L.map((a,k)=>`<tr><td>${th(a)?`<img loading="lazy" src="${th(a)}" alt="封面" data-k="i${k}">`:''}</td><td>${a.wk}</td><td>${(a.name||a.tag||a.cid).slice(0,28)}</td><td class="n">${fi(a.inst)}</td><td class="n">${cp(a.cpi)}</td><td>${a.ver}</td></tr>`).join('')+'</tbody>';
  const pick=k=>k[0]==='w'?D.w2[+k.slice(1)]:L[+k.slice(1)];
  $$('#tW2 img,#tIn img').forEach(el=>el.onclick=()=>{const a=pick(el.dataset.k);
    lb(a.v?`<video src="${a.v}" controls autoplay muted playsinline></video>`:`<img src="${a.i||a.t}" alt="封面大图">`,`<span>${a.wk} ${a.name||a.tag||''}</span>${a.spend!=null?`<b class="num">${fmt(a.spend)}</b>`:`<span>新增 ${fi(a.inst)}，CPI ${cp(a.cpi)}</span>`}${a.url?`<a href="${a.url}" target="_blank" rel="noopener">变色龙视频（需登录）</a>`:''}`)});
}
</script>
</body></html>
